name: Verify source

on:
  # Local validation is the default while hosted Actions are billing-blocked.
  # Keep the workflow for optional manual use, without automatic run spam.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: npm run check
      - name: Lint and verify reviewed warnings
        run: npm run lint
      - name: Run tests
        run: npm test

  renderer:
    name: Library and experience browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install developer tools without downloading Electron
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Chrome is available
        run: google-chrome --version
      - name: Check the renderer with 5,000 games
        run: npm run test:renderer
        env:
          ORBIT_QA_OUTPUT: ${{ runner.temp }}/orbit-browser
      - name: Check interactions and responsive scrolling
        run: npm run test:experience
        env:
          ORBIT_QA_OUTPUT: ${{ runner.temp }}/orbit-browser
      - name: Check cinematic game showcases and narrow layouts
        run: node tests/visual-showcase.cjs
        env:
          ORBIT_SHOWCASE_SCREENSHOT_DIR: ${{ runner.temp }}/orbit-browser
      - name: Check cinematic NextGen statistics and motion
        run: npm run test:cinematic
        env:
          ORBIT_CINEMATIC_V2_SCREENSHOTS: ${{ runner.temp }}/orbit-browser
      - name: Check full-art poster cards and overlay buttons
        run: npm run test:cards
        env:
          ORBIT_POSTER_CARD_SCREENSHOTS: ${{ runner.temp }}/orbit-browser
      - name: Check fullscreen controller navigation
        run: npm run test:controller
        env:
          ORBIT_QA_OUTPUT: ${{ runner.temp }}/orbit-browser
      - uses: actions/upload-artifact@v4
        id: browser_artifacts
        if: always()
        continue-on-error: true
        with:
          name: Orbit-browser-checks
          path: ${{ runner.temp }}/orbit-browser
          if-no-files-found: ignore
      - name: Report unavailable browser attachments
        if: steps.browser_artifacts.outcome == 'failure'
        run: echo 'Browser report upload failed; inspect the upload log for the storage or network error. Test results are recorded in their own steps.' >> "$GITHUB_STEP_SUMMARY"
