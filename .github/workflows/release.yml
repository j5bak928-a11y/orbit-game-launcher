name: Build and publish signed Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.3.7)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: orbit-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    # Tag pushes run automatically once ENABLE_GITHUB_RELEASE_WORKFLOW=true is set
    # in repository variables (prevents racing with local manual releases).
    # Manual workflow_dispatch always runs for the specified tag.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_GITHUB_RELEASE_WORKFLOW == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Resolve release ref
        id: ref
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag format: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify version matches tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ref.outputs.version }}
        run: |
          $expected = $env:RELEASE_VERSION
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $expected -or $tauri -ne $expected) {
            throw "Version mismatch: tag=$expected package.json=$pkg tauri.conf.json=$tauri"
          }

      - name: Run JS and Rust checks
        run: |
          npm run check
          npm test
          npm run tauri:stage
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build Windows installers with stripped paths
        shell: pwsh
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/orbit --remap-path-prefix=${{ runner.temp }}=/temp
        run: npm run tauri:build -- --bundles nsis,msi --no-sign --ci

      - name: Package, sign updater artifacts, and generate checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
          RELEASE_VERSION: ${{ steps.ref.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret required to sign updater artifacts.'
          }
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPO
          $release = 'src-tauri/target/release'
          $dist = Join-Path $release 'release-assets'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $nsis = Join-Path $release "bundle/nsis/Orbit Launcher_${version}_x64-setup.exe"
          $msi = Join-Path $release "bundle/msi/Orbit Launcher_${version}_x64_en-US.msi"
          $exe = Join-Path $release 'orbit-launcher.exe'

          & npx.cmd tauri signer sign --app-version $version $nsis
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$nsis.sig")) {
            throw 'Failed to sign NSIS setup installer.'
          }

          $distSetup = Join-Path $dist "Orbit-Launcher-Setup-$version.exe"
          $distSig = Join-Path $dist "Orbit-Launcher-Setup-$version.exe.sig"
          $distMsi = Join-Path $dist "Orbit-Launcher-$version.msi"
          $distZip = Join-Path $dist "Orbit-Launcher-Portable-$version.zip"

          Copy-Item $nsis $distSetup -Force
          Copy-Item "$nsis.sig" $distSig -Force
          Copy-Item $msi $distMsi -Force
          Compress-Archive -Path $exe -DestinationPath $distZip -CompressionLevel Optimal -Force

          $signature = (Get-Content -LiteralPath $distSig -Raw).Trim()
          $latestJsonObj = [ordered]@{
            version = $version
            notes = "Orbit Launcher $tag"
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = "https://github.com/$repo/releases/download/$tag/Orbit-Launcher-Setup-$version.exe"
              }
            }
          }
          $latestPath = Join-Path $dist 'latest.json'
          [IO.File]::WriteAllText($latestPath, ($latestJsonObj | ConvertTo-Json -Depth 6), [Text.UTF8Encoding]::new($false))

          $files = @(
            "Orbit-Launcher-Setup-$version.exe",
            "Orbit-Launcher-$version.msi",
            "Orbit-Launcher-Portable-$version.zip",
            "Orbit-Launcher-Setup-$version.exe.sig",
            'latest.json'
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dist $f)).Hash.ToLowerInvariant()
            "$hash  $f"
          }
          [IO.File]::WriteAllText((Join-Path $dist 'SHA256SUMS.txt'), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

      - name: Upload or create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = Get-ChildItem 'src-tauri/target/release/release-assets' -File | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --verify-tag --title "Orbit Launcher $tag" --generate-notes
          }
