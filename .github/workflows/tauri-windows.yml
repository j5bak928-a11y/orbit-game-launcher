name: Verify Orbit Rust / Tauri desktop

on:
  # Optional manual verification only. Local GNU-LLVM builds need no Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-tauri-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-tauri:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify JS bridge
        run: node --test tests/tauri-adapter.test.cjs
      - name: Prepare static frontend
        run: npm run tauri:stage
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Compile Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Test Rust migrations and native services
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build unsigned Windows desktop installers
        run: npm run tauri:build
      - name: Run Rust SQLite benchmark
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path reports/native-benchmarks | Out-Null
          cargo run --release --manifest-path src-tauri/Cargo.toml --locked --example benchmark | Tee-Object -FilePath reports/native-benchmarks/rust.txt
          if ($LASTEXITCODE -ne 0) { throw 'Rust benchmark failed' }
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        id: benchmark_artifact
        continue-on-error: true
        with:
          name: Orbit-Benchmarks-${{ github.sha }}
          path: reports/native-benchmarks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload review builds
        uses: actions/upload-artifact@v4
        id: tauri_build_artifact
        continue-on-error: true
        with:
          name: Orbit-Tauri-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/orbit-launcher.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Report unavailable native build downloads
        if: steps.tauri_build_artifact.outcome == 'failure' || steps.benchmark_artifact.outcome == 'failure'
        shell: pwsh
        run: |
          'Native compilation/tests/build result is in preceding steps, but GitHub Actions artifact upload failed. Review installer hashes and retrieve binaries only after storage quota is available; no successful download is claimed.' >> $env:GITHUB_STEP_SUMMARY
