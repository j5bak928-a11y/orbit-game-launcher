name: Verify Orbit Rust / Tauri desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/ui/**'
      - 'scripts/prepare-tauri.cjs'
      - 'tests/tauri-adapter.test.cjs'
      - 'package*.json'
      - '.github/workflows/tauri-windows.yml'
  push:
    branches:
      - feat/tauri-rust-port

permissions:
  contents: read

jobs:
  windows-tauri:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify JS bridge
        run: node --test tests/tauri-adapter.test.cjs
      - name: Prepare static frontend
        run: npm run tauri:stage
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Compile Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Test Rust migrations and native services
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build unsigned Windows desktop installers
        run: npm run tauri:build
      - name: Upload review builds
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Tauri-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/orbit-launcher.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
