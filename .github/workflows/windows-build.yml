name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/orbit-v1.1-upgrade
    paths:
      - "src/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: write

jobs:
  windows:
    name: Installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows installer and portable EXE
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach executables to a private prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "orbit-windows-$version-build-$env:GITHUB_RUN_NUMBER"
          $files = @(Get-ChildItem -Path release -Filter '*.exe' | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw 'Expected both a Windows installer and portable EXE.' }
          gh release create $tag @files --title "Orbit Windows $version (test build)" --notes "Unsigned Windows installer and portable executable from this source commit. Not yet verified by an interactive Windows launch test. This repository currently contains v1.0.0; v1.1 source has not been pushed." --prerelease --latest=false --target $env:GITHUB_SHA
