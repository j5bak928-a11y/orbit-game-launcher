name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a Windows release
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "package*.json"
      - ".github/workflows/windows-build.yml"
  push:
    branches:
      - main
      - feature/orbit-v1.1-upgrade
    paths:
      - "src/**"
      - "assets/**"
      - "package*.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact_uploaded: ${{ steps.build_artifacts.outcome == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows installer and portable EXE
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows outputs
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -Filter '*.exe')
          if ($files.Count -lt 2) { throw 'Expected both a Windows installer and portable EXE.' }
      - name: Keep reviewable Windows builds
        id: build_artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Orbit-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Report unavailable Windows downloads
        if: steps.build_artifacts.outcome == 'failure'
        shell: pwsh
        run: |
          'The installer and portable EXE were built and verified, but their artifact upload failed. Inspect the upload log for the storage or network error; downloads are unavailable until upload succeeds.' >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish requested Windows build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.windows.outputs.artifact_uploaded == 'true'
        with:
          name: Orbit-Windows-${{ github.sha }}
          path: release
      - name: Set up Node.js for storage-independent release build
        if: needs.windows.outputs.artifact_uploaded != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies for release fallback
        if: needs.windows.outputs.artifact_uploaded != 'true'
        run: npm ci --no-audit --no-fund
      - name: Rebuild release without depending on artifact storage
        if: needs.windows.outputs.artifact_uploaded != 'true'
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach executables to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $files = @(Get-ChildItem -Path release -Filter '*.exe' | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw 'Expected both a Windows installer and portable EXE.' }
          gh release create $tag @files --title "Orbit $version" --notes "Windows installer and portable executable. Includes fullscreen controller navigation, game detection and artwork fixes. These builds are unsigned. Native detection and installed-game launches require a Windows smoke test." --latest --target $env:GITHUB_SHA
