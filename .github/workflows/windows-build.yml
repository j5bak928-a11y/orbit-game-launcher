name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "package*.json"
      - ".github/workflows/windows-build.yml"
  push:
    branches:
      - main
      - feature/orbit-v1.1-upgrade
    paths:
      - "src/**"
      - "assets/**"
      - "package*.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows installer and portable EXE
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep reviewable Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish requested Windows build
    if: github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-${{ github.sha }}
          path: release
      - name: Attach executables to a private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="orbit-windows-$version-build-$GITHUB_RUN_NUMBER"
          gh release create "$tag" release/*.exe --title "Orbit Windows $version (test build)" --notes "Unsigned Windows installer and portable executable from source commit $GITHUB_SHA. Native detection and installed-game launches require a Windows smoke test." --prerelease --latest=false --target "$GITHUB_SHA"
