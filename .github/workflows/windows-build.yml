name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/orbit-v1.1-upgrade
    paths:
      - "src/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows installer and portable EXE
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-exe
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
