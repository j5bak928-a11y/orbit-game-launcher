name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a Windows release
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "package*.json"
      - ".github/workflows/windows-build.yml"
  push:
    branches:
      - main
      - feature/orbit-v1.1-upgrade
      - feature/orbit-reliability-performance-updates
    paths:
      - "src/**"
      - "assets/**"
      - "package*.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact_uploaded: ${{ steps.build_artifacts.outcome == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Set up MSVC for process inventory
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile native process inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/bin | Out-Null
          cl.exe /nologo /O2 /EHsc /std:c++17 /Fe:assets/bin/orbit-process-list.exe src/native/process-list.cpp /link Psapi.lib
          if ($LASTEXITCODE -ne 0 -or !(Test-Path assets/bin/orbit-process-list.exe)) { throw 'Native tracker compilation failed' }
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build Windows installer and portable EXE
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Windows outputs
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -Filter '*.exe')
          if ($files.Count -lt 2) { throw 'Expected both a Windows installer and portable EXE.' }
      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() + '  ' + $_.Name
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Upload reviewable Windows builds
        id: build_artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Orbit-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Report unavailable downloads
        if: steps.build_artifacts.outcome == 'failure'
        shell: pwsh
        run: |
          'Windows build succeeded but artifact upload failed; inspect upload logs.' >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish requested Windows release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.windows.outputs.artifact_uploaded == 'true'
        with:
          name: Orbit-Windows-${{ github.sha }}
          path: release
      - name: Set up Node.js for fallback build
        if: needs.windows.outputs.artifact_uploaded != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies for fallback build
        if: needs.windows.outputs.artifact_uploaded != 'true'
        run: npm ci --no-audit --no-fund
      - name: Set up MSVC for fallback build
        if: needs.windows.outputs.artifact_uploaded != 'true'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile tracker for fallback build
        if: needs.windows.outputs.artifact_uploaded != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/bin | Out-Null
          cl.exe /nologo /O2 /EHsc /std:c++17 /Fe:assets/bin/orbit-process-list.exe src/native/process-list.cpp /link Psapi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native tracker compilation failed' }
      - name: Rebuild release if artifact storage unavailable
        if: needs.windows.outputs.artifact_uploaded != 'true'
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create checksums for fallback release
        shell: pwsh
        run: |
          if (!(Test-Path release/SHA256SUMS.txt)) {
            $lines = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object {
              (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() + '  ' + $_.Name
            }
            $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          }
      - name: Attach installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          if (@($files | Where-Object { $_ -match '\.exe$' }).Count -lt 2) { throw 'Expected installer and portable EXE' }
          if (-not ($files | Where-Object { $_ -match 'latest\.yml$' })) { throw 'Missing latest.yml update manifest' }
          gh release create $tag @files --title "Orbit $version" --notes "Windows installer and portable executable. Unsigned builds; real Windows smoke tests and signing remain required." --latest --target $env:GITHUB_SHA
